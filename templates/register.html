{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<h2>Create Account</h2>

<form method="POST">
    {{ form.hidden_tag() }}

    {{ form.username.label }}
    {{ form.username() }}

     {{ form.email.label }}
    {{ form.email() }}

    {{ form.password.label }}
    {{ form.password() }}

    {{ form.submit() }}
</form>
{% endblock %}
